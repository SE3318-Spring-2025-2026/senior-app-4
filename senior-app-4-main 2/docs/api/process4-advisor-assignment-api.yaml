openapi: 3.0.3
info:
  title: "Process 4: Advisor Assignment API"
  version: 2.0.0
  description: |
    Senior Project Management System — Level-2 DFD Process 4

    ## Sub-Processes
    | ID   | Name |
    |------|------|
    | 4.1  | Submit Advisor Request |
    | 4.2  | Validate Request |
    | 4.3  | Notify Advisor of Request |
    | 4.4  | Process Advisor Decision |
    | 4.5  | Assign Advisor to Group |
    | 4.6  | Notify Student of Decision |
    | 4.7  | Coordinator Override Assignment |
    | 4.8  | Log Assignment Events |
    | 4.9  | Disband Unassigned Groups |
    | 4.10 | Release Advisee Group |

    ## Data Stores
    D1 Users · D2 Groups · D8 Notifications · D9 System Logs · D10 Schedule

    ## External Entities
    Student · Professor / Advisor · Coordinator

    ## Business Rules
    - Only the **team leader** can submit or withdraw an advisor request.
    - A group can only have **one active advisor request** at a time (PENDING).
    - If a group **already has an assigned advisor**, a new request is blocked.
      The advisor must **release** the group first before a new request can be made.
    - The **Coordinator can transfer** a group from one advisor to another (see also P2-API: POST /groups/{groupId}/advisor/transfer).
    - Groups **without an advisor after the deadline** will be disbanded (scheduled + manual trigger).
    - All assignment events (approve, reject, override, release) are logged to D9 System Logs (internal side-effect, cross-process with P2 audit).
    - All phases are **bounded by a schedule** set by the Coordinator (D10).

servers:
  - url: /api/v1
    description: Development server

tags:
  - name: "4.1 Advisor Requests"
    description: "Submit, view, and withdraw advisor requests (DFD: f1–f6)"
  - name: "4.4 Advisor Decisions"
    description: "Professor approves or rejects requests (DFD: f7–f10)"
  - name: "4.5/4.7 Advisor Assignments"
    description: "Assignment results, coordinator overrides, and release (DFD: f11–f16, f23–f25)"
  - name: "4.9 Group Maintenance"
    description: "Disband unassigned groups after deadline (DFD: f26–f28)"

# ─────────────────────────────────────────────
#  PATHS
# ─────────────────────────────────────────────
paths:

  # ═══════════════════════════════════════════
  #  4.1 / 4.2  —  /advisor-requests
  # ═══════════════════════════════════════════
  /advisor-requests:
    get:
      tags:
        - "4.1 Advisor Requests"
      summary: "List advisor requests"
      description: |
        **DFD:** 4.1 Submit Advisor Request
        **DFD flows:** f5 (pendingNotification → D8), request list retrieval

        Returns advisor requests filtered by role:
        - **Professors** see only requests addressed to them.
        - **Coordinators** see all requests system-wide.
        - **Students** see only their own group's requests.
      operationId: listAdvisorRequests
      parameters:
        - name: status
          in: query
          description: Filter by request status
          schema:
            type: string
            enum: [PENDING, APPROVED, REJECTED, WITHDRAWN]
            default: PENDING
        # TODO: [P4-FILTER-1] NEW — Filter by team for coordinator view
        - name: teamId
          in: query
          description: "Filter by team/group ID (Coordinator use)"
          schema:
            type: string
            format: uuid
        # TODO: [P4-FILTER-2] NEW — Filter by professor for coordinator view
        - name: professorId
          in: query
          description: "Filter by professor ID (Coordinator use)"
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Requests retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdvisorRequestListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - "4.1 Advisor Requests"
      summary: "Submit advisor request"
      description: |
        **DFD:** 4.1 Submit Advisor Request + 4.2 Validate Request
        **DFD flows:** f1 (adviseeRequest: teamId + professorId), f2 (rawRequest),
        f3 (verifyGroupExists → D2), f4 (verifyAdvisorRole → D1)

        Team leader requests a specific professor to be their advisor.

        ## Validation Rules (4.2)
        - Group must exist and requester must be the team leader (D2 check).
        - Professor must exist and have role=professor (D1 check).
        - Group must NOT already have an assigned advisor.
          If advisor is assigned, group must be released first (409 error).
        - Group must NOT have another PENDING request for a different professor.
        - Request must be within the advisor assignment schedule window (D10 check).

        ## Internal Side-Effects
        - **4.3 Notify:** adviseeNotification sent to the professor (D8).
        - **4.8 Log:** auditEntry written to D9 (requestCreated event).
      operationId: createAdvisorRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdvisorRequestCreateRequest'
      responses:
        '201':
          description: Request created successfully. Professor notified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdvisorRequestCreateResponse'
        '400':
          description: |
            Validation error. Possible causes:
            - Missing required fields
            - Professor does not exist or is not a professor role
            - Group does not exist
            - Requester is not the team leader
            - Another PENDING request already exists for this group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        # TODO: [P4-CONFLICT-1] NEW — Advisor already assigned conflict
        '403':
          description: |
            Forbidden. Possible causes:
            - Advisor assignment deadline has passed (D10 Schedule)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            Conflict. Possible causes:
            - Group already has an assigned advisor. The advisor must release
              the group first (POST /advisor-assignments/{groupId}/release)
              before a new request can be submitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ═══════════════════════════════════════════
  #  4.1  —  /advisor-requests/{requestId}
  # ═══════════════════════════════════════════
  /advisor-requests/{requestId}:
    parameters:
      - $ref: '#/components/parameters/requestIdParam'

    # TODO: [P4-DETAIL-1] NEW ENDPOINT — Get advisor request detail
    get:
      tags:
        - "4.1 Advisor Requests"
      summary: "Get advisor request details"
      description: |
        **DFD:** 4.2 Validate Request reads from D1 (Users) and D2 (Groups).

        Returns full details of a specific advisor request, including:
        - Team information (name, member count, leader)
        - Professor information (name, current advisee count)
        - Request status and timestamps
        - Decision reason (if rejected)

        Used by professors to review group details before making a decision.
      operationId: getAdvisorRequestById
      responses:
        '200':
          description: Request details retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdvisorRequestDetailResponse'
        '404':
          description: Request not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - "4.1 Advisor Requests"
      summary: "Withdraw advisor request"
      description: |
        **DFD:** 4.1 Submit Advisor Request (withdrawRequest flow)
        **DFD flows:** withdrawRequest → 4.1, revokeNotification → D8

        Student withdraws a pending advisor request.

        ## Validation
        - Only PENDING requests can be withdrawn.
        - Only the team leader who created the request can withdraw it.

        ## Internal Side-Effects
        - **Notification cancel:** The unread adviseeNotification sent to the professor
          is soft-deleted (status=REVOKED) in D8. This prevents the professor from
          acting on a revoked request.
        - **4.8 Log:** auditEntry written to D9 (requestWithdrawn event).
      operationId: withdrawAdvisorRequest
      responses:
        '200':
          description: |
            Request withdrawn successfully.
            Professor's pending notification has been revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: |
            Cannot withdraw. Possible causes:
            - Request is not in PENDING status (already decided)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Requester is not the team leader
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Request not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ═══════════════════════════════════════════
  #  4.4 / 4.5  —  /advisor-requests/{requestId}/decision
  # ═══════════════════════════════════════════
  /advisor-requests/{requestId}/decision:
    parameters:
      - $ref: '#/components/parameters/requestIdParam'

    post:
      tags:
        - "4.4 Advisor Decisions"
      summary: "Process advisor decision (approve/reject)"
      description: |
        **DFD:** 4.4 Process Advisor Decision + 4.5 Assign Advisor to Group
        **DFD flows:** f7 (approval/rejection → Professor), f8 (approvedRequest → 4.5),
        f9 (rejectedRequest → 4.6), f11 (advisorAssignees → D2),
        f12 (assignmentComplete → 4.6)

        Professor approves or rejects a pending advisor request.

        ## On APPROVE
        - 4.5: Group's advisorId is updated in D2 (Groups table).
        - 4.5: The professor's status is updated (incremented advisee count).
        - 4.6: Student receives advisorDecisionNotification (D8).
        - 4.8: auditEntry (advisorAssigned) → D9.

        ## On REJECT
        - Request status set to REJECTED with reason.
        - 4.6: Student receives advisorDecisionNotification with rejection reason (D8).
        - 4.8: auditEntry (advisorRejected) → D9.
      operationId: processAdvisorDecision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdvisorDecisionRequest'
      responses:
        '200':
          description: Decision recorded successfully. Student notified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdvisorDecisionResponse'
        '400':
          description: |
            Validation error. Possible causes:
            - Request is not in PENDING status
            - Missing decision value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            Forbidden. Possible causes:
            - Professor is not the target of this request
            - Assignment deadline passed (D10)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Request not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ═══════════════════════════════════════════
  #  4.7  —  /advisor-assignments/override
  # ═══════════════════════════════════════════
  /advisor-assignments/override:
    post:
      tags:
        - "4.5/4.7 Advisor Assignments"
      summary: "Coordinator override assignment"
      description: |
        **DFD:** 4.7 Coordinator Override Assignment
        **DFD flows:** overrideAssignment → 4.7, f23 (forceAdvisorAssignment → D2),
        overrideStatusResponse → Coordinator

        Coordinator forcefully assigns an advisor to a group, bypassing the
        normal request-approve flow. This is used when:
        - A group has not found an advisor and the deadline is approaching.
        - The coordinator determines a specific advisor-group match is appropriate.

        If the group already has an advisor, the existing assignment is replaced.

        ## Internal Side-Effects
        - Notification sent to both the assigned professor and group leader (D8).
        - 4.8 Log: auditEntry (advisorOverridden) → D9.

        ## Related
        - For transferring a group FROM one advisor TO another, also see
          Process 2 API: POST /groups/{groupId}/advisor/transfer (P2-API-03).
      operationId: overrideAssignment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OverrideAssignmentRequest'
      responses:
        '200':
          description: Assignment overridden successfully. Both parties notified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverrideAssignmentResponse'
        '400':
          description: |
            Validation error. Possible causes:
            - Group does not exist
            - Advisor does not exist or is not a professor role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Coordinator role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ═══════════════════════════════════════════
  #  4.10  —  /advisor-assignments/{groupId}/release
  # ═══════════════════════════════════════════
  /advisor-assignments/{groupId}/release:
    parameters:
      - name: groupId
        in: path
        required: true
        description: Group/team ID to release from advisor
        schema:
          type: string
          format: uuid

    post:
      tags:
        - "4.5/4.7 Advisor Assignments"
      summary: "Release advisee group"
      description: |
        **DFD:** 4.10 Release Advisee Group
        **DFD flows:** releaseCommand (groupId) → 4.10,
        removeAdvisorAssignment → D2, releaseNotification → D8

        Professor releases their currently assigned advisee group.
        After release, the group's advisorId is set to null in D2.
        The group can then submit a new advisor request.

        ## Business Rule
        This action is the prerequisite for a group to make a new advisor request.
        Without release, POST /advisor-requests will return 409 Conflict.

        ## Internal Side-Effects
        - **Notification:** releaseNotification sent to group leader (D8).
        - **4.8 Log:** auditEntry (advisorReleased) → D9.
      operationId: releaseGroup
      responses:
        '200':
          description: |
            Group released successfully. Group leader notified.
            Group can now submit a new advisor request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: |
            Validation error. Possible causes:
            - Group does not have this professor as advisor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            Forbidden. Possible causes:
            - Professor is not the advisor of this group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Group not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ═══════════════════════════════════════════
  #  TODO: [P4-ASSIGN-1] NEW ENDPOINT — List current advisor assignments
  # ═══════════════════════════════════════════
  /advisor-assignments:
    get:
      tags:
        - "4.5/4.7 Advisor Assignments"
      summary: "List current advisor assignments"
      description: |
        **DFD flows:** advisorAssignees read from D2

        Returns the current advisor-group mapping across the system.
        - **Professors** see only their own assigned groups.
        - **Coordinators** see all assignments system-wide.

        Used by coordinators to answer: "Which group is assigned to which advisor?"
      operationId: listAdvisorAssignments
      parameters:
        - name: advisorId
          in: query
          description: Filter by advisor/professor ID
          schema:
            type: string
            format: uuid
        - name: hasAdvisor
          in: query
          description: "Filter groups by advisor status (true = has advisor, false = no advisor)"
          schema:
            type: boolean
      responses:
        '200':
          description: Assignments retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdvisorAssignmentListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ═══════════════════════════════════════════
  #  4.9  —  /groups/disband-unassigned
  # ═══════════════════════════════════════════
  /groups/disband-unassigned:
    post:
      tags:
        - "4.9 Group Maintenance"
      summary: "Disband unassigned groups"
      description: |
        **DFD:** 4.9 Disband Unassigned Groups
        **DFD flows:** D10 → deadlineReached → 4.9, deleteUnassignedGroups → D2

        Deletes/deactivates groups that have no advisor assigned after the deadline.

        ## Trigger Modes
        1. **Automatic (scheduled):** Backend runs this via `@Scheduled(cron='...')`
           when the advisor assignment deadline in D10 is reached.
        2. **Manual (this endpoint):** Coordinator can trigger this manually via API
           for emergency situations. **Coordinator role required.**

        ## Internal Side-Effects
        - Disbanded group members receive notification (D8).
        - 4.8 Log: auditEntry (groupDisbanded) → D9 for each disbanded group.
      operationId: disbandUnassignedGroups
      responses:
        '200':
          description: Maintenance completed. Returns list of disbanded groups.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisbandResponse'
        '403':
          description: Coordinator role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

# ─────────────────────────────────────────────
#  COMPONENTS
# ─────────────────────────────────────────────
components:
  parameters:
    requestIdParam:
      name: requestId
      in: path
      required: true
      description: Advisor request ID
      schema:
        type: string
        format: uuid

  schemas:
    # ── Request Schemas ──────────────────────

    AdvisorRequestCreateRequest:
      type: object
      required: [teamId, professorId]
      properties:
        teamId:
          type: string
          format: uuid
          description: Group/team ID. Only team leader can make requests.
        professorId:
          type: string
          format: uuid
          description: Target professor's user ID
        message:
          type: string
          description: Optional message to the professor explaining why they want this advisor.

    AdvisorDecisionRequest:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [APPROVE, REJECT]
          description: Professor's decision on the advisor request
        reason:
          type: string
          description: Required if REJECT. Explains why the request was rejected.

    OverrideAssignmentRequest:
      type: object
      required: [teamId, advisorId]
      properties:
        teamId:
          type: string
          format: uuid
          description: Group/team ID to assign
        advisorId:
          type: string
          format: uuid
          description: Professor ID to assign as advisor
        reason:
          type: string
          description: Coordinator's reason for the override (for audit trail)

    # ── Response Schemas ─────────────────────

    SuccessResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Operation completed successfully.

    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: error
        message:
          type: string
          example: Validation failed.
        errorCode:
          type: string
          example: ADVISOR_ALREADY_ASSIGNED
          description: |
            Machine-readable error codes:
            - ADVISOR_ALREADY_ASSIGNED: Group has an advisor, release required
            - PENDING_REQUEST_EXISTS: Group already has a PENDING request
            - DEADLINE_PASSED: Schedule window closed
            - NOT_TEAM_LEADER: Requester is not the team leader
            - INVALID_PROFESSOR: Target user is not a professor role
            - GROUP_NOT_FOUND: Group does not exist

    # TODO: [P4-CREATE-1] NEW SCHEMA — Advisor request create response with detail
    AdvisorRequestCreateResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Advisor request submitted. Professor has been notified.
        data:
          type: object
          properties:
            id:
              type: string
              format: uuid
            teamId:
              type: string
              format: uuid
            professorId:
              type: string
              format: uuid
            status:
              type: string
              example: PENDING
            requestedAt:
              type: string
              format: date-time

    AdvisorRequestListResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdvisorRequestSummary'

    AdvisorRequestSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        teamId:
          type: string
          format: uuid
        teamName:
          type: string
          example: "Alpha Team"
        professorId:
          type: string
          format: uuid
        professorName:
          type: string
          example: "Dr. Ahmet Yılmaz"
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED, WITHDRAWN]
        requestedAt:
          type: string
          format: date-time
        decidedAt:
          type: string
          format: date-time
          nullable: true

    # TODO: [P4-DETAIL-2] NEW SCHEMA — Detailed advisor request response
    AdvisorRequestDetailResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        data:
          type: object
          properties:
            id:
              type: string
              format: uuid
            status:
              type: string
              enum: [PENDING, APPROVED, REJECTED, WITHDRAWN]
            message:
              type: string
              nullable: true
              description: Student's message to the professor
            requestedAt:
              type: string
              format: date-time
            decidedAt:
              type: string
              format: date-time
              nullable: true
            reason:
              type: string
              nullable: true
              description: Rejection reason (if rejected)
            team:
              type: object
              description: Group/team details (joined from D2)
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
                  example: "Alpha Team"
                memberCount:
                  type: integer
                  example: 4
                leaderName:
                  type: string
                  example: "Furkan Gencer"
                leaderId:
                  type: string
                  format: uuid
                hasCurrentAdvisor:
                  type: boolean
                  description: Whether the group currently has an assigned advisor
            professor:
              type: object
              description: Target professor details (joined from D1)
              properties:
                id:
                  type: string
                  format: uuid
                fullName:
                  type: string
                  example: "Dr. Ahmet Yılmaz"
                email:
                  type: string
                  format: email
                currentAdviseeCount:
                  type: integer
                  example: 3
                  description: Number of groups currently assigned to this professor

    AdvisorDecisionResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: "Request approved. Advisor assigned to group."
        data:
          type: object
          properties:
            requestId:
              type: string
              format: uuid
            decision:
              type: string
              enum: [APPROVE, REJECT]
            teamId:
              type: string
              format: uuid
            advisorId:
              type: string
              format: uuid
              nullable: true
              description: Set only on APPROVE

    OverrideAssignmentResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: "Advisor assignment overridden. Both parties notified."
        data:
          type: object
          properties:
            teamId:
              type: string
              format: uuid
            previousAdvisorId:
              type: string
              format: uuid
              nullable: true
              description: Previous advisor (null if none was assigned)
            newAdvisorId:
              type: string
              format: uuid

    # TODO: [P4-ASSIGN-2] NEW SCHEMA — Advisor assignment list response
    AdvisorAssignmentListResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        data:
          type: array
          items:
            type: object
            properties:
              teamId:
                type: string
                format: uuid
              teamName:
                type: string
              advisorId:
                type: string
                format: uuid
                nullable: true
              advisorName:
                type: string
                nullable: true
              assignedAt:
                type: string
                format: date-time
                nullable: true
              assignmentType:
                type: string
                enum: [REQUESTED, OVERRIDDEN]
                description: How the assignment was made

    # TODO: [P4-DISBAND-1] UPDATED — Disband response with affected groups
    DisbandResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: "3 groups disbanded."
        data:
          type: object
          properties:
            disbandedCount:
              type: integer
              example: 3
            disbandedGroups:
              type: array
              items:
                type: object
                properties:
                  teamId:
                    type: string
                    format: uuid
                  teamName:
                    type: string
                  memberCount:
                    type: integer
