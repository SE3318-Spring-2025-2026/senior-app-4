# Isolated H2 in-memory database for Issue #170 tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate configuration for H2
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Disable Flyway for tests to avoid PostgreSQL-specific migration issues on H2
spring.flyway.enabled=false

# Token settings for tests
token.secret=test_secret_key_that_is_long_enough_to_be_secure_for_tests
token.expiration-seconds=3600
