spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: true

server:
  port: 0

scrum:
  sync:
    cron: "0 0 2 * * *"

token:
  secret: test-secret-key-for-testing-only
  expiration-seconds: 3600
