spring:
  config:
    import: "optional:file:./application.properties"

  application:
    name: spms-backend

  flyway:
    baseline-on-migrate: true
    enabled: true
    out-of-order: true

  datasource:
    url: ${db.url}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 2
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public

server:
  port: 8080

github:
  client-id: ${GITHUB_CLIENT_ID}
  client-secret: ${GITHUB_CLIENT_SECRET}
  redirect-uri: ${GITHUB_REDIRECT_URI}

token:
  secret: ${TOKEN_SECRET}
  expiration-seconds: ${TOKEN_EXPIRATION_SECONDS:3600}

scrum:
  sync:
    cron: ${SCRUM_SYNC_CRON:0 0 2 * * *}

openai:
  api-key: ${OPENAI_API_KEY:}

supabase:
  url: ${supabase.url}
  service-role-key: ${supabase.service-role-key}
  storage:
    bucket: ${supabase.storage.bucket:submissions}

spring.mail:
  host: smtp.gmail.com
  port: 587
  username: ${MAIL_USERNAME}
  password: ${MAIL_PASSWORD}
  properties:
    mail:
      smtp:
        auth: true
        starttls:
          enable: true

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}