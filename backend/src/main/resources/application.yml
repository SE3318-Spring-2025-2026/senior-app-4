spring:
  config:
    import: "optional:file:./application.properties"

  application:
    name: spms-backend

  flyway:
    baseline-on-migrate: true
    enabled: true

  datasource:
    url: ${DB_URL}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 2
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public

server:
  port: 8080

github:
  client-id: ${GITHUB_CLIENT_ID}
  client-secret: ${GITHUB_CLIENT_SECRET}
  redirect-uri: ${GITHUB_REDIRECT_URI}

token:
  secret: ${TOKEN_SECRET}
  expiration-seconds: ${TOKEN_EXPIRATION_SECONDS:3600}

scrum:
  sync:
    cron: ${SCRUM_SYNC_CRON:0 0 2 * * *}

jira:
  encryption:
    key: ${JIRA_ENCRYPTION_KEY}