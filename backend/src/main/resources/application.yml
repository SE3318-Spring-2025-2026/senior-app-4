spring:
  application:
    name: spms-backend
  datasource:
    url: ${DB_URL}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public

server:
  port: 8080

github:
  client-id: ${GITHUB_CLIENT_ID}
  client-secret: ${GITHUB_CLIENT_SECRET}
  redirect-uri: ${GITHUB_REDIRECT_URI}

token:
  secret: ${TOKEN_SECRET:spms-issue-7-dev-secret}
  expiration-seconds: ${TOKEN_EXPIRATION_SECONDS:3600}
