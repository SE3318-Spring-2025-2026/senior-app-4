openapi: 3.0.3
info:
  title: "Process 3: Submissions & Reviews API"
  version: 2.0.0
  description: |
    Senior Project Management System — Level-2 DFD Process 3

    ## Sub-Processes
    | ID  | Name |
    |-----|------|
    | 3.1 | Submit Deliverable (Proposal / SoW) |
    | 3.2 | Validate Submission |
    | 3.3 | Assign Committee to Submission |
    | 3.4 | Review & Comment on Deliverable |
    | 3.5 | Grade Deliverable |
    | 3.6 | Notify Submission Status |
    | 3.7 | View Submissions |

    ## Data Stores
    D2 Groups · D4 Deliverables · D5 Committees · D7 Grades · D8 Notifications · D10 Schedule

    ## External Entities
    Student · Professor / Advisor · Coordinator

    ## Deliverable Lifecycle (Sequential Pipeline)
    ```
    PROPOSAL → Proposal Review → [if REVISION_REQUESTED] → REVISED_PROPOSAL
                                → [if APPROVED] ────────────→ Grading
    REVISED_PROPOSAL → Grading
    Grading Complete → STATEMENT_OF_WORK → SoW Review → SoW Grading
    ```
    Each phase is bounded by a schedule set by the Coordinator (D10).

    ## Business Rules
    - Individual students cannot submit; only groups.
    - Only groups assigned to a committee can submit (requires Process 5 completion).
    - Only committee members assigned to the group can review and grade.
    - Committee members grade their own groups AND groups of other advisors.
    - Grading criteria are defined by the Coordinator per deliverable type.

servers:
  - url: /api/v1
    description: Development server

tags:
  - name: "3.1 Submit Deliverable"
    description: "Submit new deliverables — Proposal, Revised Proposal, or SoW (DFD: f1, f2, f3)"
  - name: "3.2 Revisions"
    description: "Submit revised versions of deliverables (DFD: revisionRequest → Student → 3.1)"
  - name: "3.4 Reviews"
    description: "Committee members review and leave comments (DFD: f9, f10, f11, f12)"
  - name: "3.5 Grading"
    description: "Committee members grade deliverables per grading criteria (DFD: f13, f14, f14b)"
  - name: "3.7 View Submissions"
    description: "List and view submission details with filters (DFD: f19, f20, f21, f22)"

# ─────────────────────────────────────────────
#  PATHS
# ─────────────────────────────────────────────
paths:

  # ═══════════════════════════════════════════
  #  3.1 / 3.2 / 3.3 / 3.7  —  /submissions
  # ═══════════════════════════════════════════
  /submissions:
    post:
      tags:
        - "3.1 Submit Deliverable"
      summary: "Submit a new deliverable"
      description: |
        **DFD:** 3.1 Submit Deliverable + 3.2 Validate Submission + 3.3 Assign Committee
        **DFD flows:** f1 (documentContent), f2 (rawSubmission), f3 (verifyGroupMembership → D2),
        f4 (deliverableRecord → D4), f7 (lookupCommittee → D5), f8 (assignedCommitteeId → D4)

        Team leader submits a deliverable document for their group.
        Backend auto-assigns the committee (3.3) based on the group's advisor → committee mapping in D5.

        ## Sequential Pipeline Validation (Internal Logic)
        - **PROPOSAL**: Group must be assigned to a committee (D5 lookup). No prior submission required.
        - **REVISED_PROPOSAL**: A PROPOSAL for this group must exist with status REVISION_REQUESTED.
          If the original proposal was APPROVED, revised submission is not required.
        - **STATEMENT_OF_WORK**: The group's PROPOSAL (or REVISED_PROPOSAL) must have grading completed.

        ## Authorization
        - Only group leader can submit on behalf of the group.
        - Individual students cannot submit.

        ## Internal Side-Effects (3.6 Notify)
        - On success: notification sent to assigned committee members (D8).
        - On success: notification alert sent to Coordinator.
      operationId: createSubmission
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SubmissionCreateRequest'
      responses:
        '201':
          description: Submission created and committee auto-assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionCreateResponse'
        '400':
          description: |
            Validation error. Possible causes:
            - Missing required fields
            - Invalid deliverableType
            - Sequential pipeline violation (e.g., SoW submitted before Proposal grading)
            - File format not supported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            Forbidden. Possible causes:
            - User is not the group leader
            - Group is not assigned to any committee (Process 5 prerequisite)
            - Submission deadline has passed (D10 Schedule check)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Group not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags:
        - "3.7 View Submissions"
      summary: "List submissions with filters"
      description: |
        **DFD:** 3.7 View Submissions
        **DFD flows:** f19 (viewRequest), f20 (queryDeliverables → D4), f20b (deliverableList),
        f21 (submissionReport → Coordinator), f22 (viewOwnSubmissions → Student)

        Returns submissions filtered by query parameters.
        - **Students** see only their own group's submissions.
        - **Professors** see submissions for groups in their assigned committee.
        - **Coordinators** see all submissions (group restriction removed).
      operationId: listSubmissions
      parameters:
        - name: teamId
          in: query
          description: Filter by team/group ID
          schema:
            type: string
            format: uuid
        # TODO: [P3-FILTER-1] Added coordinator filter — status-based filtering
        - name: status
          in: query
          description: "Filter by submission status"
          schema:
            type: string
            enum: [PENDING_REVIEW, UNDER_REVIEW, REVISION_REQUESTED, APPROVED, GRADED]
        # TODO: [P3-FILTER-2] Added coordinator filter — committee-based filtering
        - name: committeeId
          in: query
          description: "Filter by assigned committee ID"
          schema:
            type: string
            format: uuid
        # TODO: [P3-FILTER-3] Added coordinator filter — deliverable type filtering
        - name: deliverableType
          in: query
          description: "Filter by deliverable type"
          schema:
            type: string
            enum: [PROPOSAL, REVISED_PROPOSAL, STATEMENT_OF_WORK]
        # TODO: [P3-FILTER-4] Added deadline-awareness filter for coordinator dashboard
        - name: deadlineStatus
          in: query
          description: "Filter by deadline proximity (Coordinator only)"
          schema:
            type: string
            enum: [APPROACHING, OVERDUE]
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Submissions retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionsListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ═══════════════════════════════════════════
  #  3.7  —  /submissions/{submissionId}
  # ═══════════════════════════════════════════
  /submissions/{submissionId}:
    parameters:
      - $ref: '#/components/parameters/submissionIdParam'

    get:
      tags:
        - "3.7 View Submissions"
      summary: "Get submission details"
      description: |
        **DFD:** 3.7 View Submissions
        **DFD flows:** f20 (queryDeliverables → D4), f20b (deliverableList → Student/Coordinator)

        Returns full details of a specific submission, including:
        - File URL, status, deadlines
        - Assigned committee info
        - Review summary (count, latest status)
        - Grade summary (average, individual grades if grading complete)
        - Revision history (linked previous/next submissions)
      operationId: getSubmissionById
      responses:
        '200':
          description: Submission details retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionDetailResponse'
        '404':
          description: Submission not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ═══════════════════════════════════════════
  #  3.2 (revision)  —  /submissions/{submissionId}/revisions
  #  TODO: [P3-REV-1] NEW ENDPOINT — Revision submission
  # ═══════════════════════════════════════════
  /submissions/{submissionId}/revisions:
    parameters:
      - $ref: '#/components/parameters/submissionIdParam'

    post:
      tags:
        - "3.2 Revisions"
      summary: "Submit a revised version of a deliverable"
      description: |
        **DFD:** 3.1 → 3.2 cycle via revisionRequest (3.4 → Student → 3.1)
        **DFD flows:** revisionRequest → Student, then Student re-submits documentContent

        Allows a group leader to submit a revised version of a previously reviewed deliverable.
        Creates a new submission record linked to the original via `parentSubmissionId`.
        The original submission's status is updated to SUPERSEDED.

        ## Prerequisites
        - The parent submission must have status REVISION_REQUESTED.
        - Only the group leader of the owning team can submit revisions.
        - Must be within the revision deadline (D10 Schedule check).

        ## Versioning
        - Each revision increments `revisionNumber`.
        - Full revision chain is preserved (no data overwritten).

        ## Internal Side-Effects (3.6 Notify)
        - On success: committee members notified that revised submission is ready for review.
      operationId: createRevision
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The revised document file
                description:
                  type: string
                  description: Optional description of changes made in this revision
      responses:
        '201':
          description: Revision submitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevisionCreateResponse'
        '400':
          description: |
            Validation error. Possible causes:
            - Parent submission status is not REVISION_REQUESTED
            - File format not supported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            Forbidden. Possible causes:
            - User is not the group leader
            - Revision deadline has passed (D10)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Parent submission not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    # TODO: [P3-REV-2] NEW ENDPOINT — List revision history
    get:
      tags:
        - "3.2 Revisions"
      summary: "Get revision history for a submission"
      description: |
        Returns the full revision chain for a submission, ordered by revision number.
        Includes the original submission and all subsequent revisions.
      operationId: getRevisionHistory
      responses:
        '200':
          description: Revision history retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevisionHistoryResponse'
        '404':
          description: Submission not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ═══════════════════════════════════════════
  #  3.4  —  /submissions/{submissionId}/reviews
  # ═══════════════════════════════════════════
  /submissions/{submissionId}/reviews:
    parameters:
      - $ref: '#/components/parameters/submissionIdParam'

    post:
      tags:
        - "3.4 Reviews"
      summary: "Add review or comment to a deliverable"
      description: |
        **DFD:** 3.4 Review & Comment on Deliverable
        **DFD flows:** f9 (reviews + comments → Professor), f10 (deliverableContent → D4),
        f11 (reviewComments + updateDeliverableStatus → D4)

        Committee members review and leave comments on a submission.
        Only professors who are members of the submission's assigned committee can review.

        ## Authorization
        - Caller must be a member of the committee assigned to this submission.
        - Validates committee membership via D5.

        ## Status Transitions
        - APPROVED: Submission passes review, can proceed to grading.
        - REVISION_REQUESTED: Student must submit a revised version via POST .../revisions.

        ## Internal Side-Effects (3.6 Notify)
        - If REVISION_REQUESTED: notification sent to group leader (revisionRequest).
        - If APPROVED: notification sent to group leader and committee for grading phase.
        - Review deadline check from D10.
      operationId: createReview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewCreateRequest'
      responses:
        '200':
          description: Review submitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: |
            Validation error. Possible causes:
            - Submission is not in a reviewable state (e.g., already graded)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            Forbidden. Possible causes:
            - Professor is not a member of the assigned committee
            - Review deadline has passed (D10)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Submission not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    # TODO: [P3-REVIEW-1] NEW ENDPOINT — List reviews for a submission
    get:
      tags:
        - "3.4 Reviews"
      summary: "List reviews for a submission"
      description: |
        **DFD:** 3.4 Review & Comment on Deliverable
        **DFD flows:** f10 (deliverableContent read from D4), revisionRequest → Student

        Returns all reviews and comments for a specific submission.
        Used by:
        - **Students**: To read reviewer comments before submitting revisions.
        - **Professors**: To see what other committee members have commented.
        - **Coordinators**: To monitor review progress.
      operationId: listReviews
      responses:
        '200':
          description: Reviews retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewListResponse'
        '404':
          description: Submission not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ═══════════════════════════════════════════
  #  3.5  —  /submissions/{submissionId}/grades
  # ═══════════════════════════════════════════
  /submissions/{submissionId}/grades:
    parameters:
      - $ref: '#/components/parameters/submissionIdParam'

    # TODO: [P3-GRADE-1] UPDATED — Multi-reviewer grading model
    post:
      tags:
        - "3.5 Grading"
      summary: "Grade a submission (per committee member)"
      description: |
        **DFD:** 3.5 Grade Deliverable
        **DFD flows:** f13 (deliverableGrades → Professor), f14 (finalGrades → D7),
        f14b (deliverableGrades → D4), f15 (gradingComplete → 3.6)

        Each committee member submits their individual grade for a deliverable.
        The system calculates the final grade as the average of all committee member grades.

        ## Multi-Reviewer Model
        - Each committee member grades independently.
        - A committee member can only grade once per submission (update not allowed, use PUT).
        - Grading is complete when ALL committee members have submitted grades.
        - Grading criteria are defined by the Coordinator per deliverable type.

        ## Authorization
        - Only members of the assigned committee can grade.
        - Validates committee membership via D5.

        ## Internal Side-Effects (3.6 Notify)
        - When ALL committee members have graded: gradingComplete notification to group leader.
        - When ALL committee members have graded: notification alert to Coordinator.
        - Grading deadline check from D10.
      operationId: gradeSubmission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GradeCreateRequest'
      responses:
        '201':
          description: Grade submitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GradeCreateResponse'
        '400':
          description: |
            Validation error. Possible causes:
            - Submission not in gradeable state (must be APPROVED or UNDER_REVIEW complete)
            - Grade value out of range
            - Professor already graded this submission (use PUT to update)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            Forbidden. Possible causes:
            - Professor is not a member of the assigned committee
            - Grading deadline has passed (D10)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Submission not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    # TODO: [P3-GRADE-2] NEW ENDPOINT — List grades for a submission
    get:
      tags:
        - "3.5 Grading"
      summary: "Get grades for a submission"
      description: |
        **DFD flows:** D7 read, D4 read (deliverableGrades)

        Returns all individual grades and the computed average for a submission.
        - **Students** see only the final average and overall feedback after grading is complete.
        - **Professors** see all individual grades from committee members.
        - **Coordinators** see all individual grades and can monitor grading progress.
      operationId: listGrades
      responses:
        '200':
          description: Grades retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GradeListResponse'
        '404':
          description: Submission not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ═══════════════════════════════════════════
  #  3.5  —  /submissions/{submissionId}/grades/{gradeId}
  #  TODO: [P3-GRADE-3] NEW ENDPOINT — Update own grade
  # ═══════════════════════════════════════════
  /submissions/{submissionId}/grades/{gradeId}:
    parameters:
      - $ref: '#/components/parameters/submissionIdParam'
      - name: gradeId
        in: path
        required: true
        description: Grade record ID
        schema:
          type: string
          format: uuid

    put:
      tags:
        - "3.5 Grading"
      summary: "Update own grade for a submission"
      description: |
        Allows a committee member to update their previously submitted grade
        before the grading deadline. Only the grade author can update.
      operationId: updateGrade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GradeCreateRequest'
      responses:
        '200':
          description: Grade updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '403':
          description: Not the grade author or grading deadline passed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Grade not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ═══════════════════════════════════════════
  #  Grading Criteria  —  /grading-criteria
  #  TODO: [P3-CRITERIA-1] NEW ENDPOINT — Coordinator defines grading criteria
  # ═══════════════════════════════════════════
  /grading-criteria:
    get:
      tags:
        - "3.5 Grading"
      summary: "List grading criteria"
      description: |
        Returns grading criteria defined by the Coordinator.
        Criteria may differ per deliverable type (PROPOSAL vs SOW).
      operationId: listGradingCriteria
      parameters:
        - name: deliverableType
          in: query
          description: Filter criteria by deliverable type
          schema:
            type: string
            enum: [PROPOSAL, REVISED_PROPOSAL, STATEMENT_OF_WORK]
      responses:
        '200':
          description: Criteria retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GradingCriteriaListResponse'

    post:
      tags:
        - "3.5 Grading"
      summary: "Create grading criteria (Coordinator only)"
      description: |
        Coordinator defines grading criteria for a specific deliverable type.
        These criteria are displayed to committee members during grading.
      operationId: createGradingCriteria
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GradingCriteriaCreateRequest'
      responses:
        '201':
          description: Criteria created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '403':
          description: Coordinator role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

# ─────────────────────────────────────────────
#  COMPONENTS
# ─────────────────────────────────────────────
components:
  parameters:
    submissionIdParam:
      name: submissionId
      in: path
      required: true
      description: Unique submission ID
      schema:
        type: string
        format: uuid

  schemas:
    # ── Request Schemas ──────────────────────

    SubmissionCreateRequest:
      type: object
      required: [teamId, deliverableType, file]
      properties:
        teamId:
          type: string
          format: uuid
          description: The group's ID. Only group leader can submit.
        # TODO: [P3-ENUM-1] UPDATED — deliverableType is now a strict enum
        deliverableType:
          type: string
          enum: [PROPOSAL, REVISED_PROPOSAL, STATEMENT_OF_WORK]
          description: |
            Type of deliverable. Sequential rules apply:
            - PROPOSAL: No prerequisite (first submission)
            - REVISED_PROPOSAL: Requires existing PROPOSAL with status REVISION_REQUESTED
            - STATEMENT_OF_WORK: Requires PROPOSAL/REVISED_PROPOSAL grading complete
        file:
          type: string
          format: binary
          description: The deliverable document file
        description:
          type: string
          description: Optional description or summary of the submission

    ReviewCreateRequest:
      type: object
      required: [comments, status]
      properties:
        comments:
          type: string
          example: "Please revise section 2 with more detailed analysis."
          description: Review comments and feedback
        status:
          type: string
          enum: [APPROVED, REVISION_REQUESTED]
          description: |
            Review decision:
            - APPROVED: Submission passes, proceeds to grading phase
            - REVISION_REQUESTED: Student must submit revised version

    # TODO: [P3-GRADE-4] UPDATED — Grade request now includes criteria scores
    GradeCreateRequest:
      type: object
      required: [grade]
      properties:
        grade:
          type: number
          minimum: 0
          maximum: 100
          example: 85.5
          description: Overall grade for the deliverable (0-100)
        feedback:
          type: string
          description: Optional written feedback from the grader
        criteriaScores:
          type: array
          description: Optional breakdown by grading criteria (if criteria defined by coordinator)
          items:
            type: object
            required: [criteriaId, score]
            properties:
              criteriaId:
                type: string
                format: uuid
              score:
                type: number
                minimum: 0
                maximum: 100

    GradingCriteriaCreateRequest:
      type: object
      required: [deliverableType, name, weight]
      properties:
        deliverableType:
          type: string
          enum: [PROPOSAL, REVISED_PROPOSAL, STATEMENT_OF_WORK]
        name:
          type: string
          example: "Technical Feasibility"
          description: Criteria name
        description:
          type: string
          example: "Evaluate the technical feasibility and implementation approach"
        weight:
          type: number
          minimum: 0
          maximum: 100
          example: 30
          description: Weight percentage of this criteria in final grade

    # ── Response Schemas ─────────────────────

    SuccessResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Operation completed successfully.

    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: error
        message:
          type: string
          example: Validation failed.
        errorCode:
          type: string
          example: COMMITTEE_NOT_ASSIGNED

    SubmissionCreateResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Submission created successfully.
        data:
          type: object
          properties:
            id:
              type: string
              format: uuid
            teamId:
              type: string
              format: uuid
            deliverableType:
              type: string
              example: PROPOSAL
            status:
              type: string
              example: PENDING_REVIEW
            assignedCommitteeId:
              type: string
              format: uuid
              description: Auto-assigned committee based on group's advisor
            submittedAt:
              type: string
              format: date-time

    SubmissionsListResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        data:
          type: array
          items:
            $ref: '#/components/schemas/SubmissionSummary'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'

    SubmissionSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        teamId:
          type: string
          format: uuid
        teamName:
          type: string
        deliverableType:
          type: string
          enum: [PROPOSAL, REVISED_PROPOSAL, STATEMENT_OF_WORK]
        status:
          type: string
          enum: [PENDING_REVIEW, UNDER_REVIEW, REVISION_REQUESTED, APPROVED, GRADED]
        assignedCommitteeId:
          type: string
          format: uuid
        revisionNumber:
          type: integer
          example: 1
        submittedAt:
          type: string
          format: date-time
        # TODO: [P3-DEADLINE-1] Added deadline info to list response
        deadline:
          type: string
          format: date-time
          description: Applicable deadline from D10 Schedule
        isOverdue:
          type: boolean

    SubmissionDetailResponse:
